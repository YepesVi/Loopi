<div class="container mt-4">
  <h2 class="text-center mb-4">Editar Perfil</h2>

  <!-- Avatar -->
  <div class="avatar-preview mb-3 text-center">
    <img [src]="form.value.fotoUrl || defaultFoto" alt="Foto de perfil" class="avatar rounded-circle shadow" width="120" height="120">
  </div>

  <!-- Formulario -->
  <form [formGroup]="form" (ngSubmit)="actualizar()">
    <input class="form-control mb-2" formControlName="cedula" placeholder="Cédula" readonly>
    <input class="form-control mb-2" formControlName="nombre" placeholder="Nombre">
    <input class="form-control mb-2" formControlName="apellido" placeholder="Apellido">
    <input class="form-control mb-2" formControlName="telefono" placeholder="Teléfono">
    <input class="form-control mb-2" formControlName="correo" placeholder="Correo" readonly>
    <input class="form-control mb-2" formControlName="direccion" placeholder="Dirección">
    <input class="form-control mb-2" formControlName="password" placeholder="Nueva contraseña" type="password">

    <select class="form-control mb-3" formControlName="fotoUrl">
      <option value="">Selecciona una foto</option>
      <option value="https://i.pravatar.cc/150?u=usuario1">Avatar 1</option>
      <option value="https://i.pravatar.cc/150?u=usuario2">Avatar 2</option>
      <option value="https://i.pravatar.cc/150?u=usuario3">Avatar 3</option>
      <option value="https://i.pravatar.cc/150?u=usuario4">Avatar 4</option>
      <option value="https://i.pravatar.cc/150?u=usuario5">Avatar 5</option>
    </select>

    <button class="btn btn-primary w-100">Actualizar</button>
  </form>

  <!-- Mensaje de respuesta -->
  <div *ngIf="mensaje" class="mt-3 text-center" [ngClass]="{ 'text-success': !error, 'text-danger': error }">
    {{ mensaje }}
  </div>
</div>
