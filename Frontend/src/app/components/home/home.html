<div class="home-container">
  <!-- 🖼️ Carrusel -->
  <div id="mainCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="assets/carrusel/imagen1.jpg" class="d-block w-100" alt="Promoción 1" />
      </div>
      <div class="carousel-item">
        <img src="assets/carrusel/imagen2.jpg" class="d-block w-100" alt="Promoción 2" />
      </div>
    </div>

    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#mainCarousel"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>

    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#mainCarousel"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>

  <!-- 🛍️ Productos por categoría -->
  <h1 class="text-center mb-4">Categorías</h1>

  <div *ngFor="let categoria of categorias" class="mb-5">
    <div class="d-flex align-items-center mb-3">
      <h3 class="mb-0 me-2">{{ categoria.key }}</h3>
      <a class="btn btn-link p-0 opcion-ver-mas" style="margin-top: 8px">Ver más</a>
    </div>

    <div 
      [id]="'carousel-' + categoria.key"
      class="carousel slide category-carousel"
      data-bs-ride="carousel"
      data-bs-touch="false"
      data-bs-keyboard="false"
    >
      <div class="carousel-inner">
        <div
          *ngFor="let chunk of dividirEnGrupos(categoria.value, 4); let i = index"
          class="carousel-item"
          [ngClass]="{ active: i === 0 }"
        >
          <div class="row">
            <div class="col-md-3" *ngFor="let producto of chunk">
              <div 
                *ngIf="producto.estado?.toLowerCase() === 'publicado'" 
                class="h-100"
              >
                <app-product-card [producto]="producto"></app-product-card>
                
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controles del carrusel -->
      <button
        class="carousel-control-prev"
        type="button"
        [attr.data-bs-target]="'#carousel-' + categoria.key"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        [attr.data-bs-target]="'#carousel-' + categoria.key"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>

  <!-- 🟣 Modal centrado con botón de inicio de sesión -->
  <div 
    class="modal fade show d-block" 
    tabindex="-1" 
    role="dialog" 
    *ngIf="mostrarAdvertencia"
    style="background-color: rgba(0, 0, 0, 0.5); z-index: 1060;"
  >
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content" style="background-color: #6f42c1; color: white;">
        <div class="modal-header border-0">
          <h5 class="modal-title">🔒 Acceso requerido</h5>
          <button type="button" class="btn-close btn-close-white" (click)="cerrarAdvertencia()" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p>Debes iniciar sesión para agregar este producto.</p>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-light" (click)="irALogin()">¿Quieres iniciar sesión?</button>
          <button class="btn btn-outline-light" (click)="cerrarAdvertencia()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
</div>
