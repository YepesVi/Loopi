<div class="home-container">

    <!-- 🖼️ Carrusel -->
    <div id="mainCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="assets/carrusel/imagen1.jpg" class="d-block w-100 carousel-img" alt="Promoción 1">
            </div>
            <div class="carousel-item">
                <img src="assets/carrusel/imagen2.jpg" class="d-block w-100 carousel-img" alt="Promoción 2">
            </div>
        </div>
        
        <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        
        <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    

</div>


<div class="home-container container py-4">

    <h1 class="titulo-categorias text-center mb-5">Categorías</h1>

    <div *ngIf="categorias.length === 0" class="text-center text-muted mt-5">
        <p>No hay productos disponibles aún.</p>
    </div>

    <div *ngFor="let categoria of categorias" class="mb-5">
        <div class="d-flex align-items-center mb-3">
            <h3 class="mb-0 me-2">{{ categoria.key }}</h3>
            <a class="btn btn-link p-0 opcion-ver-mas" style="margin-top: 8px;">Ver más</a>
        </div>

        <div class="row g-4">
            <div *ngFor="let producto of categoria.value" class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img [src]="'http://localhost:8081' + producto.fotos" class="card-img-top" alt="{{ producto.titulo }}" />
                    <div class="card-body">
                        <h5 class="card-title">{{ producto.titulo }}</h5>
                        <p class="card-text text-muted small">{{ producto.descripcion }}</p>
                    </div>
                    <div class="card-footer bg-transparent">
                        <span class="fw-bold text-success">$ {{ producto.precio | number }}</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- 🔐 Login antes de footer -->
    <section class="login-section text-center mb-5">
        <h3>¿Ya tienes cuenta?</h3>
        <p>Inicia sesión para acceder a tus pedidos y más beneficios</p>
        <button class="btn btn-dark px-4 py-2">Iniciar sesión</button>
    </section>
